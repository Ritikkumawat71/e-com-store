<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<section>
		<div class="container mt-5 p-5">
			<div class="card card-sh">
				<div class="card-header text-center">
					<p class="fs-4" th:if="${userType==1}">Users</p>
					<p class="fs-4" th:if="${userType==2}">Admin</p>
					<p th:if="${session.successMsg}" th:text="${session.successMsg}"
						class="text-success fw-bold">
					<div th:text="${@commonServiceImpl.removeSessionMessage()}"></div>
					</p>

					<div th:if="${session.errorMsg}" th:text="${session.errorMsg}"
						class="text-danger fw-bold">
						<div th:text="${@commonServiceImpl.removeSessionMessage()}"></div>
					</div>
				</div>
				<div class="card-body">
					<table class="table">
						<thead>
							<tr>
								<th scope="col">Sr. No.</th>
								<th scope="col">Profile</th>
								<th scope="col">Name</th>
								<th scope="col">Email</th>
								<th scope="col">Mobile Number</th>
								<th scope="col">Address</th>
								<th scope="col">Status</th>
								<th scope="col">Action</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="u : ${users}">
								<th scope="row">[[${u.id}]]</th>
								<td><img alt="loading..."
									th:src="@{'/img/profile_img/'+${u.profileImage}}" width="50px" height="50px"></td>
								<td>[[${u.name}]]</td>
								<td>[[${u.email}]]</td>
								<td>[[${u.mobileNumber}]]</td>
								<td>[[${u.address+', '+u.city+', '+u.state}]]</td>
								<td>[[${u.isEnable}]]</td>
								<td><a th:href="@{'/admin/updateStatus?status=true&id='+${u.id}}+'&type='+${userType}" class="btn btn-sm btn-primary">Active</a>
									<a th:href="@{'/admin/updateStatus?status=false&id='+${u.id}}+'&type='+${userType}" class="btn btn-sm btn-danger">InActive</a></td>
							</tr>

						</tbody>
					</table>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
