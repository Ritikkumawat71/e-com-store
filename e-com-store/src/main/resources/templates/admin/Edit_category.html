<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<section>
		<div class="container-fluid p-5 mt-5">
			<div class="row">
				<div class="col-md-3 offset-md-5">
					<div class="card card-sh">
						<div class="card-header text-center">
							<p class="fs-4">Edit Category</p>
							
							 <p th:if="${session.successMsg}" th:text="${session.successMsg}" class="text-success fw-bold">
								<div th:text="${@commonServiceImpl.removeSessionMessage()}"></div>
							</p> 
							
						 <div th:if="${session.errorMsg}" th:text="${session.errorMsg}" class="text-danger fw-bold">
								<div th:text="${@commonServiceImpl.removeSessionMessage()}"></div>
							</div> 

						</div>
						<div class="card-body">
							<form action="/admin/updateCategory" method="post"
								enctype="multipart/form-data">
								<input type="hidden" name="id" th:value="${category.id}">
								<div class="mb-3">
									<label>Enter Category</label> <input type="text" name="name" th:value="${category.name}"
										class="form-control">
								</div>
								<div class="mb-3">
									<label>Status</label>
									<div class="form-check">
										<input class="form-check-input" type="radio" name="isActive"
											id="radioDefault1" th:checked="${category.isActive==true}" value="true"> <label
											class="form-check-label" for="radioDefault1"> Active
										</label>
									</div>
									<div class="form-check">
										<input class="form-check-input" type="radio" name="isActive"
											id="radioDefault2" value="false" th:checked="${category.isActive==false}"> <label
											class="form-check-label" for="radioDefault2">
											InActive </label>
									</div>
								</div>
								<div class="mb-3">
									<label>Upload Image</label> <input type="file" name="file"
										class="form-control">
								</div>
								<img alt="loading..." th:src="@{'img/category_image/'+${category.imageName}}" width="100px" height="100px">
								<button class="btn btn-primary col-md-12">Update</button>
							</form>
						</div>
					</div>
				</div>
				
				
			</div>
		</div>
	</section>
</body>
</html>
