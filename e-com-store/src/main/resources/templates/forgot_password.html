<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<section>
		<div class="container mt-5 p-5">
			<div class="row">
				<div class="col-md-6 p-5">
					<img alt="Image not load" src="img/d.png" width="100%"
						height="400px">
				</div>
				<div class="col-md-6 mt-3 p-5">
					<div class="card shadow p-3 mb-5 bg-body-tertiary rounded">
						<div class="card-header text-center">
							<p class="fs-4 text-center">Forgot Password</p>
							
						<div th:if="${session.successMsg}" th:text="${session.successMsg}" class="text-success fw-bold">
								<p th:text="${@commonServiceImpl.removeSessionMessage()}"></p>
							</div> 
							
						 <div th:if="${session.errorMsg}" th:text="${session.errorMsg}" class="text-danger fw-bold">
								<div th:text="${@commonServiceImpl.removeSessionMessage()}"></div>
							</div>
							
						</div>
						<div class="card-body">
							<form action="/forgot-password" method="post">
								<div class="mb-3">
									<label class="form-label">Email</label> <input
										class="form-control" name="email" type="email" placeholder="Enter your email ">
								</div>
						
						     <div class="text-center">
								<button type="submit"
									class="btn bg-primary text-white">Send</button>
							 </div>
							</form>
						</div>
						
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
