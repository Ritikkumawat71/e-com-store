<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<section>
		<div class="container mt-5 p-5 bg-light">
			<div class="row">
				<div class="col-md-10 offset-md-1">
					<p class="fs-3 text-center">My Profile</p>
					<div th:if="${session.successMsg}" th:text="${session.successMsg}" class="text-success fw-bold text-center">
								<div th:text="${@commonServiceImpl.removeSessionMessage()}"></div>
							</div> 
							
						 <div th:if="${session.errorMsg}" th:text="${session.errorMsg}" class="text-danger fw-bold text-center">
								<p th:text="${@commonServiceImpl.removeSessionMessage()}"></p>
							</div> 
					<hr>
					<div class="text-center">
						<img alt="" th:src="@{'../img/profile_img/'+${user.profileImage}}"
							style="width: 110px; height: 110px; border-radius: 50%;"
							class="border p-2">
					</div>
					<div class="col-md-8 offset-md-2 mt-3">
						<table class="table table-borderless">
							<tbody>
								<form action="/user/update-profile" method="post" enctype="multipart/form-data">
								<tr>
									<th scope="row">Name</th>
									<td>:</td>
									<td><input type="text" name="name" th:value="${user.name}"
										class="form-control"></td>
								</tr>
								<tr>
									<th scope="row">Mobile Number</th>
									<td>:</td>
									<td><input type="text" name="mobileNumber" th:value="${user.mobileNumber}"
										class="form-control"></td>
								</tr>
								<tr>
									<th scope="row">Email</th>
									<td>:</td>
									<td><input type="email" name="" th:value="${user.email}"
										class="form-control" readonly></td>
								</tr>
								<tr>
									<th scope="row">Address</th>
									<td>:</td>
									<td><input type="text" name="address" th:value="${user.address}"
										class="form-control"></td>
								</tr>
								<tr>
									<th scope="row">City</th>
									<td>:</td>
									<td><input type="text" name="city" th:value="${user.city}"
										class="form-control"></td>
								</tr>
								<tr>
									<th scope="row">State</th>
									<td>:</td>
									<td><input type="text" name="state" th:value="${user.state}"
										class="form-control"></td>
								</tr>
								<tr>
									<th scope="row">Pincode</th>
									<td>:</td>
									<td><input type="text" name="pincode" th:value="${user.pincode}"
										class="form-control"></td>
								</tr>
								<tr>
									<th scope="row">Image</th>
									<td>:</td>
									<td><input type="file" name="img" 
										class="form-control" value=""></td>
								</tr>
								<tr>
									<th scope="row">Role</th>
									<td>:</td>
									<td>
									<input type="text" name="" th:value="${user.role}"
										class="form-control" readonly></td>
								</tr>
								<tr>
									<th scope="row">Account Status</th>
									<td>:</td>
									<td><input type="text" name="" th:value="${user.isEnable}"
										class="form-control" readonly></td>
									<input type="hidden" th:value = "${user.id}" name="id">	
								</tr>
								<tr>
									<td></td>
									<td class="text-center">
										<button class="btn btn-primary btn-sm">Update</button>
									</td>
								</tr>
								</form>
							</tbody>
						</table>
					</div>
				</div>
				<hr>
				<div class="col-md-10 offset-md-1 mt-1">
					<div class="row">
						<p class="text-center fs-3">Change Password</p>
						<div class="col-md-6 offset-md-3">
							<table class="table table-borderless">
								<tbody>
									<form action="/user/change-password" method="post">
										<tr>
											<th scope="row">Current Password</th>
											
											<td><input type="password" name="currentPassword" class="form-control"></td>
										</tr>
										<tr>
											<th scope="row">New Password</th>
											
											<td><input type="password" name="newPassword" class="form-control"></td>
										</tr>
										<tr>
											<th scope="row">Confirm Password</th>
											
											<td><input type="password" name="confirmPassword" class="form-control"></td>
										</tr>
										<tr>
											<td></td>
											<td class="text-center">
												<button class="btn btn-primary btn-sm">Update</button>
											</td>
										</tr>
									</form>
								</tbody>
							</table>
						</div>
					</div>
				</div>

			</div>
		</div>
	</section>
</body>
</html>
