<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
	th:replace="~{base::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<section>
		<div class="container-fluid p-5 mt-5">
			<div class="row">
				<div class="col-md-3">
					<div class="card card-sh">
						<div class="card-header text-center">
							<p class="fs-4">Add Category</p>

							<p th:if="${session.successMsg}" th:text="${session.successMsg}"
								class="text-success fw-bold">
							<div th:text="${@commonServiceImpl.removeSessionMessage()}"></div>
							</p>

							<div th:if="${session.errorMsg}" th:text="${session.errorMsg}"
								class="text-danger fw-bold">
								<div th:text="${@commonServiceImpl.removeSessionMessage()}"></div>
							</div>

						</div>
						<div class="card-body">
							<form action="/admin/saveCategory" method="post"
								enctype="multipart/form-data">
								<div class="mb-3">
									<label>Enter Category</label> <input type="text" name="name"
										class="form-control">
								</div>
								<div class="mb-3">
									<label>Status</label>
									<div class="form-check">
										<input class="form-check-input" type="radio" name="isActive"
											id="radioDefault1" checked value="true"> <label
											class="form-check-label" for="radioDefault1"> Active
										</label>
									</div>
									<div class="form-check">
										<input class="form-check-input" type="radio" name="isActive"
											id="radioDefault2" value="false"> <label
											class="form-check-label" for="radioDefault2">
											InActive </label>
									</div>
								</div>
								<div class="mb-3">
									<label>Upload Image</label> <input type="file" name="file"
										class="form-control">
								</div>
								<button class="btn btn-primary col-md-12">Add</button>
							</form>
						</div>
					</div>
				</div>
				<div class="col-md-8">
					<div class="card">
						<div class="card-header text-center fs-4">Category Details</div>
						<div class="card-body">
							<table class="table">
								<thead>
									<tr>
										<th scope="col">Sr.No.</th>
										<th scope="col">Category</th>
										<th scope="col">Status</th>
										<th scope="col">Image</th>
										<th scope="col">Action</th>
									</tr>
								</thead>
								<tbody>
									<tr th:each="cat : ${category}">
										<th scope="row">[[${cat.id}]]</th>
										<td>[[${cat.name}]]</td>
										<td>[[${cat.isActive}]]</td>
										<td><img
											th:src="@{'/img/category_image/'+${cat.imageName}}"
											width="50px" height="50px"></td>
										<td><a th:href="@{'/admin/editCategory/'+${cat.id}}"
											class="btn btn-primary"><i
												class="fa-solid fa-pen-to-square"></i>Edit</a> <a
											th:href="@{'/admin/deleteCategory/'+${cat.id}}"
											class="btn btn-danger"><i class="fa-solid fa-trash"></i>Delete</a>
										</td>
									</tr>
								</tbody>
							</table>
							
							<div class="row">
								<div class="col-md-4">Total Categorys :
									[[${totalElements}]]</div>
								<div class="col-md-6">

									<!-- Start Paggination -->
									<nav aria-label="Page navigation example">
										<ul class="pagination">
											<li class="page-item"><a class="page-link"
												th:classappend="${isFirst} ? 'disabled' : '' "
												th:href="@{'/admin/category?pageNo='+${pageNo-1}}"
												aria-label="Previous"> <span aria-hidden="true">&laquo;</span>
											</a></li>

											<li th:each="i:${#numbers.sequence(1, totalPages)}"
												class="page-item"
												th:classappend="${pageNo+1==i}?'active':'' "><a
												class="page-link"
												th:href="@{'/admin/category?pageNo='+${i-1}}">[[${i}]]</a></li>

											<li class="page-item"><a class="page-link"
												th:classappend="${isLast} ? 'disabled' : '' "
												th:href="@{'/admin/category?pageNo='+${pageNo+1}}"
												aria-label="Next"> <span aria-hidden="true">&raquo;</span>
											</a></li>
										</ul>
									</nav>

								</div>
							</div>
							
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
</body>
</html>
